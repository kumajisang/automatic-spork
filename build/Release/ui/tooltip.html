<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #f5f5f0;
    --text-main: #2c2c2e;
    --text-sub: #6e6e73;
    --divider: rgba(0, 0, 0, 0.06);
    --border: rgba(0, 0, 0, 0.1);
    --accent-green: #34c759;
    --accent-purple: #a078ff;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  }

  body.dark {
    --bg: #1c1c1e; 
    --text-main: #f5f5f5;
    --text-sub: #a1a1a6;
    --divider: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.1);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; padding: 15px; }

  .card {
    width: 100%; height: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 12px 16px;
    display: flex; flex-direction: column;
    color: var(--text-main);
    transition: background 0.3s, color 0.3s;
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; padding-bottom: 8px;
    border-bottom: 1px solid var(--divider);
  }

  .title-wrap {
    display: flex; flex-direction: column;
  }

  .title {
    font-size: 14px; font-weight: 800; letter-spacing: 1px;
    display: flex; align-items: center; gap: 6px;
  }

  .accent-bar {
    width: 24px; height: 2px;
    background: linear-gradient(90deg, #ff69b4, var(--accent-purple));
    border-radius: 2px; margin-top: 4px;
  }

  .device-list {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px;
  }
  .device-list::-webkit-scrollbar { display: none; }

  .device-item {
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    font-size: 13px;
    width: 100%;
  }

  .dev-name {
    color: var(--text-sub); font-weight: 600;
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
    flex: 1; 
    margin-right: 10px;
  }

  .dev-pct {
    font-weight: 900; 
    font-size: 14px;
    color: var(--text-main); 
    font-variant-numeric: tabular-nums;
    flex-shrink: 0; 
  }

  .dev-pct.charging { color: var(--accent-green); }
  .dev-pct.sleep { color: #888; }
  .dev-pct.unknown { color: #888; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title-wrap">
        <div class="title">🔋 设备电量</div>
        <div class="accent-bar"></div>
      </div>
    </div>
    <div class="device-list" id="list">
      <div class="device-item"><span class="dev-name">正在获取数据...</span></div>
    </div>
  </div>

<script>
  window.chrome.webview.addEventListener('message', event => {
    const data = event.data;
    
    if (data.action === "setTheme" && data.isDark !== undefined) {
        if (data.isDark) document.body.classList.add('dark');
        else document.body.classList.remove('dark');
    }

    if (data.devices !== undefined) {
        const listEl = document.getElementById('list');
        listEl.innerHTML = '';
        
        if (data.devices.length === 0) {
            listEl.innerHTML = '<div class="device-item"><span class="dev-name">未检测到设备</span></div>';
            return;
        }

        const showDevices = data.devices.slice(0, 4);
        showDevices.forEach(dev => {
            let pctText = '', pctClass = 'dev-pct';
            if (dev.battery === -1) { pctText = '休眠'; pctClass += ' sleep'; }
            else if (dev.battery === -2) { pctText = '未知'; pctClass += ' unknown'; }
            else { 
                pctText = dev.battery + '%'; 
                if (dev.isCharging) pctClass += ' charging'; 
            }

            let displayName = (dev.name && dev.name.trim() !== "") ? dev.name : "未知设备";
            displayName = displayName.replace(/[_\-\s]*2\.4G/ig, '')
                                     .replace(/[_\-\s]*蓝牙/ig, '')
                                     .replace(/[_\-\s]*bluetooth/ig, '')
                                     .trim();

            const item = document.createElement('div');
            item.className = 'device-item';
            item.innerHTML = `
                <span class="dev-name" title="${displayName}">${displayName}</span>
                <span class="${pctClass}">${dev.isCharging ? '⚡' : ''}${pctText}</span>
            `;
            listEl.appendChild(item);
        });

        if (data.devices.length > 4) {
            const more = document.createElement('div');
            more.className = 'device-item';
            more.style.marginTop = '4px';
            more.style.justifyContent = 'center';
            more.innerHTML = `<span class="dev-name" style="font-size:11px;">...还有 ${data.devices.length - 4} 个设备</span>`;
            listEl.appendChild(more);
        }
    }
  });

  // 👈 核心：告诉 C++ 后端，前端页面已加载完毕，可以发数据过来了
  window.onload = () => {
    if (window.chrome.webview) window.chrome.webview.postMessage("tooltip-ready");
  };
</script>
</body>
</html>
